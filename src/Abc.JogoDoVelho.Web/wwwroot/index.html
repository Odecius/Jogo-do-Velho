<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Foundation local do projeto Jogo do Velho da ABC Solutions.">
  <title>Jogo do Velho — ABC Solutions</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="card">
    <p class="eyebrow">ABC Solutions</p>
    <h1>Jogo do Velho</h1>
    <section id="home-view">
      <p>Crie uma partida e convide outra pessoa para jogar em tempo real.</p>
      <button id="create-game" class="primary" type="button">Criar partida</button>
    </section>
    <section id="game-view" hidden>
      <p class="label">Código da partida</p>
      <strong id="public-code" class="code"></strong>
      <div class="share-row">
        <input id="join-link" readonly aria-label="Link para entrar na partida">
        <button id="copy-link" type="button">Copiar link</button>
      </div>
      <p id="game-message" class="message" aria-live="polite">Conectando…</p>
      <div id="board" class="board" aria-label="Tabuleiro do jogo da velha"></div>
      <div class="players"><span id="player1-status">P1 offline</span><span id="player2-status">P2 offline</span></div>
    </section>
    <p id="error-message" class="error" role="alert"></p>
  </main>
  <footer>Developed by Abc Solutions | Built with quality and care</footer>
  <script src="/signalr.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
